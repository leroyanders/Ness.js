version: 2.1

# GitHub Actions (.github/workflows/ci.yml) is the primary pipeline and runs the
# full matrix. This config exists so a CircleCI-enabled fork still runs the same
# checks instead of reporting green on nothing.

executors:
  node:
    parameters:
      version:
        type: string
        # 22.18 is where Node runs TypeScript by stripping types, which the
        # test suite and every script in this repository now rely on.
        default: '22.18'
    docker:
      - image: cimg/node:<< parameters.version >>
    working_directory: ~/ness

commands:
  install:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci --no-audit --no-fund
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  check:
    parameters:
      version:
        type: string
    executor:
      name: node
      version: << parameters.version >>
    steps:
      - install
      - run:
          name: Formatting
          command: npm run format:check
      - run:
          # Type-checks and builds every workspace, then runs the suites
          # against that output — the tests import from dist, not from source.
          name: Types and unit tests
          command: npm test

  published-output:
    # The packages support Node 20; nothing else here runs on it any more.
    parameters:
      version:
        type: string
    executor: node
    steps:
      - install
      - run:
          name: Build the packages
          command: npm run build:packages
      - run:
          name: Load every entry point on Node << parameters.version >>
          command: |
            curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
            export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh"
            nvm install << parameters.version >>
            nvm exec << parameters.version >> node scripts/ci/imports.mjs

  e2e:
    parameters:
      template:
        type: string
    executor: node
    steps:
      - install
      - run:
          # The suite drives the CLI from its compiled bin and packs each
          # workspace, so the build has to exist before it starts.
          name: Build the packages
          command: npm run build:packages
      - run:
          name: Scaffold, build, and serve the << parameters.template >> template
          command: node scripts/e2e/smoke.ts --templates=<< parameters.template >>
          no_output_timeout: 25m

workflows:
  ci:
    jobs:
      - check:
          matrix:
            parameters:
              version: ['22.18', '24.0']
      - published-output:
          matrix:
            parameters:
              version: ['20.19']
      - e2e:
          matrix:
            parameters:
              template:
                [
                  default,
                  typescript,
                  minimal,
                  api,
                  dashboard,
                  typescript-ssr,
                  welcome,
                ]
