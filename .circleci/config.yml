version: 2.1

# GitHub Actions (.github/workflows/ci.yml) is the primary pipeline and runs the
# full matrix. This config exists so a CircleCI-enabled fork still runs the same
# checks instead of reporting green on nothing.

executors:
  node:
    parameters:
      version:
        type: string
        default: '22.11'
    docker:
      - image: cimg/node:<< parameters.version >>
    working_directory: ~/ness

commands:
  install:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci --no-audit --no-fund
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  check:
    parameters:
      version:
        type: string
    executor:
      name: node
      version: << parameters.version >>
    steps:
      - install
      - run:
          name: Formatting
          command: npm run format:check
      - run:
          name: Unit tests
          command: npm run test:unit
      - run:
          name: Type tests
          command: npm run test:types

  e2e:
    parameters:
      template:
        type: string
    executor: node
    steps:
      - install
      - run:
          name: Scaffold, build, and serve the << parameters.template >> template
          command: node scripts/e2e/smoke.mjs --templates=<< parameters.template >>
          no_output_timeout: 25m

workflows:
  ci:
    jobs:
      - check:
          matrix:
            parameters:
              version: ['20.18', '22.11', '24.0']
      - e2e:
          matrix:
            parameters:
              template:
                [default, typescript, minimal, api, dashboard, typescript-rsc]
